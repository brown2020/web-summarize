name: ci
on:
  push:
    branches: [dev, main]
  pull_request:
jobs:
  gate:
    runs-on: ubuntu-latest
    # Provider API keys are optional for this gate.
    # Build and tests use SUMMARIZE_USE_FIXTURES=true so paid LLM credits are not burned.
    # Never inline OPENAI_*/ANTHROPIC_*/GOOGLE_*/MISTRAL_*/FIREWORKS_*/NEXT_PUBLIC_* here —
    # if a future smoke job needs secrets, inject only via ${{ secrets.* }} on that job
    # (not this gate), and keep deferred provider client init in generateActions.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
        env:
          SUMMARIZE_USE_FIXTURES: "true"
      - run: npm run build
        env:
          SUMMARIZE_USE_FIXTURES: "true"
